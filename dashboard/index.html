<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIDS | Threat Monitor</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap');

        :root {
            --bg-color: #0a0a0a;
            --surface: #171717;
            --border: #262626;
            --text-main: #f5f5f5;
            --text-muted: #a3a3a3;
            --alert-high: #ef4444;
            --alert-med: #f59e0b;
            --alert-low: #10b981;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 2px solid var(--border);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.05em;
            text-transform: uppercase;
        }

        .status-badge {
            padding: 8px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 0.875rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .status-healthy { color: var(--alert-low); border-color: var(--alert-low); }
        .status-offline { color: var(--alert-high); border-color: var(--alert-high); }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface);
            border: 1px solid var(--border);
        }

        th, td {
            padding: 16px 20px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            color: var(--text-muted);
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        td {
            font-size: 0.95rem;
        }

        .severity-high { color: var(--alert-high); font-weight: 700; }
        .severity-medium { color: var(--alert-med); font-weight: 700; }
        .severity-low { color: var(--alert-low); font-weight: 700; }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: var(--text-muted);
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>NIDS Alerts</h1>
            <div id="system-status" class="status-badge">Checking API...</div>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Threat Title</th>
                    <th>Severity</th>
                    <th>Risk Score</th>
                    <th>Status</th>
                    <th>Timestamp</th>
                </tr>
            </thead>
            <tbody id="alerts-body">
                <tr>
                    <td colspan="6" class="empty-state">Waiting for traffic data...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:5000/api';

        // Check API Health
        function checkHealth() {
            const statusBadge = document.getElementById('system-status');
            fetch(`${API_URL}/health`)
                .then(res => res.json())
                .then(data => {
                    statusBadge.innerText = 'System Online';
                    statusBadge.className = 'status-badge status-healthy';
                })
                .catch(err => {
                    statusBadge.innerText = 'API Offline';
                    statusBadge.className = 'status-badge status-offline';
                });
        }

        // Fetch and display alerts dynamically
        function loadAlerts() {
            fetch(`${API_URL}/alerts`)
                .then(res => res.json())
                .then(data => {
                    const tbody = document.getElementById('alerts-body');
                    if (data.length === 0) return; // Keep empty state if no alerts
                    
                    tbody.innerHTML = ''; // Clear rows
                    data.forEach(alert => {
                        // Assign color class based on severity string
                        let sevClass = 'severity-low';
                        if (alert.severity && alert.severity.toLowerCase() === 'high') sevClass = 'severity-high';
                        if (alert.severity && alert.severity.toLowerCase() === 'medium') sevClass = 'severity-medium';

                        const row = `<tr>
                            <td>#${alert.id}</td>
                            <td><strong>${alert.title}</strong></td>
                            <td class="${sevClass}">${alert.severity.toUpperCase()}</td>
                            <td>${alert.risk_score}</td>
                            <td style="text-transform: capitalize;">${alert.status}</td>
                            <td style="color: #a3a3a3;">${alert.timestamp}</td>
                        </tr>`;
                        tbody.innerHTML += row;
                    });
                })
                .catch(err => console.error("Error fetching alerts:", err));
        }

        // Initialize and set polling intervals
        checkHealth();
        loadAlerts();
        setInterval(checkHealth, 10000); // Check health every 10s
        setInterval(loadAlerts, 5000);   // Fetch alerts every 5s
    </script>
</body>
</html>
