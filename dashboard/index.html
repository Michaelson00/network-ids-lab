<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIDS | Threat Monitor</title>
    <style>


        :root {
            --bg-color: #0a0a0a;
            --surface: #171717;
            --border: #262626;
            --text-main: #f5f5f5;
            --text-muted: #a3a3a3;
            --alert-high: #ef4444;
            --alert-med: #f59e0b;
            --alert-low: #10b981;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 2px solid var(--border);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.05em;
            text-transform: uppercase;
        }

        .status-badge {
            padding: 8px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 0.875rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .status-healthy { color: var(--alert-low); border-color: var(--alert-low); }
        .status-offline { color: var(--alert-high); border-color: var(--alert-high); }

        .table-wrap { overflow-x: auto; }
        .header { flex-wrap: wrap; gap: 16px; }
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface);
            border: 1px solid var(--border);
        }

        th, td {
            padding: 16px 20px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            color: var(--text-muted);
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        td {
            font-size: 0.95rem;
        }

        .severity-high { color: var(--alert-high); font-weight: 700; }
        .severity-medium { color: var(--alert-med); font-weight: 700; }
        .severity-low { color: var(--alert-low); font-weight: 700; }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: var(--text-muted);
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>NIDS Alerts</h1>
            <div id="system-status" class="status-badge">Checking API...</div>
        </div>
        
        <p id="metrics" aria-live="polite">Loading alert counts...</p>
        <div class="table-wrap"><table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Threat Title</th>
                    <th>Severity</th>
                    <th>Risk Score</th>
                    <th>Source</th>
                    <th>Status</th>
                    <th>Timestamp</th>
                </tr>
            </thead>
            <tbody id="alerts-body">
                <tr>
                    <td colspan="7" class="empty-state">Waiting for traffic data...</td>
                </tr>
            </tbody>
        </table></div>
    </div>

    <script>
        const API_URL = '/api';
        async function get(path) {
            const response = await fetch(`${API_URL}/${path}`, {signal: AbortSignal.timeout(8000)});
            if (!response.ok) throw new Error(`API HTTP ${response.status}`);
            return response.json();
        }
        async function checkHealth() {
            const badge = document.getElementById('system-status');
            try {
                const data = await get('health');
                badge.textContent = data.status === 'healthy' ? 'System Online' : 'Model unavailable';
                badge.className = 'status-badge ' + (data.status === 'healthy' ? 'status-healthy' : 'status-offline');
                badge.title = data.model.error || '';
            } catch (error) {
                badge.textContent = 'API Offline';
                badge.className = 'status-badge status-offline';
            }
        }
        async function loadAlerts() {
            const tbody = document.getElementById('alerts-body');
            try {
                const [alerts, metrics] = await Promise.all([get('alerts'), get('metrics')]);
                document.getElementById('metrics').textContent = `Stored attack alerts: ${metrics.total_alerts} | ` +
                    Object.entries(metrics.by_category).map(([name, count]) => `${name}: ${count}`).join(' | ');
                tbody.replaceChildren();
                if (!alerts.length) {
                    const cell = tbody.insertRow().insertCell();
                    cell.colSpan = 7; cell.className = 'empty-state'; cell.textContent = 'No attack alerts stored.';
                }
                for (const alert of alerts) {
                    const row = tbody.insertRow();
                    const values = [alert.id, alert.category || alert.title, alert.severity || 'Unknown',
                        alert.risk_score, alert.detection_source || alert.source || 'Unknown', alert.status, alert.timestamp];
                    values.forEach((value, index) => {
                        const cell = row.insertCell();
                        cell.textContent = value ?? 'Unavailable';
                        if (index === 2 && ['Low', 'Medium', 'High'].includes(value)) cell.className = `severity-${value.toLowerCase()}`;
                    });
                    row.title = JSON.stringify(alert.rule_matches);
                }
            } catch (error) {
                document.getElementById('metrics').textContent = 'Alert data unavailable; check API connection.';
                tbody.replaceChildren();
            }
        }
        checkHealth(); loadAlerts();
        setInterval(checkHealth, 10000);
        setInterval(loadAlerts, 5000);
    </script>
</body>
</html>
